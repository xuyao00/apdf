name: Desktop builds
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      installers:
        description: Build installers as well as unpacked apps
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Native integration test (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a npm run test:e2e
          xvfb-run -a npm run test:updates
      - name: Native integration test (Windows / macOS)
        if: runner.os != 'Linux'
        run: |
          npm run test:e2e
          npm run test:updates
      - name: Package unpacked app
        run: npm run dist:dir -- --publish never
      - name: Build installers
        if: inputs.installers == true
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) npm run dist:win ;;
            Linux) npm run dist:linux ;;
            macOS) npm run dist:mac ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: apdf-${{ runner.os }}
          path: release/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ runner.os }}
          path: test-results/
